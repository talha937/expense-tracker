name: Feature request
description: Suggest an idea to improve Expense Tracker
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "## Suggest an improvement"
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your ideal implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
